name: Update HNN guide

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build guide
        run: python hnn_xmltv.py --days 7 --channel-id 2001 --out hnn.xml
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add hnn.xml
          git diff --cached --quiet || git commit -m "Update HNN guide"
          git push
